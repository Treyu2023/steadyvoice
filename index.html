<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee6">
<link rel="manifest" href="manifest.webmanifest">
<title>SteadyVoice</title>
<style>
  :root { color-scheme: light; --paper:#f3eee6; --ink:#1c1916; --card:#fffdf9; --line:#e4d9cc; --muted:#6d645b; --teal:#0e6b62; --soft:#e5f3f1; --rose:#8e2f2f; --rose-soft:#f8e8e4; --on:#f3fffc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Helvetica Neue", sans-serif; }
  body { max-width: 32rem; margin: 0 auto; min-height: 100dvh; padding: 1rem 1rem 8.5rem; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; }
  h1 { font-size: 1.6rem; margin: 0; }
  .kicker { margin: 0; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; gap: .75rem; }
  .tabs, .grid, .dock, .voices { display: grid; gap: .5rem; }
  .tabs { grid-template-columns: repeat(4, 1fr); margin: .75rem 0; }
  .grid, .voices { grid-template-columns: 1fr 1fr; }
  .dock { grid-template-columns: repeat(4, 1fr); }
  button, .card { border-radius: 1rem; }
  .tab, .ghost, .voice, .pad, .dock button, .wide { min-height: 2.75rem; }
  .tab { background: var(--card); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); font-weight: 650; }
  .tab.on, .voice.on { background: var(--ink); color: var(--paper); box-shadow: none; }
  .callbtn { border-radius: 999px; min-height: 3rem; padding: 0 1rem; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; }
  .callbtn.on { background: var(--teal); color: var(--on); box-shadow: none; }
  .pad { min-height: 5rem; padding: .75rem; text-align: left; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .pad b { display: block; font-size: 1.05rem; }
  .pad span, .muted, .card p { color: var(--muted); }
  .pad.urgent { background: var(--rose); color: #fff8f6; box-shadow: none; }
  .pad.urgent span { color: #f8e8e4; }
  .pad.need { background: var(--soft); }
  .lead, .card { font-size: .95rem; line-height: 1.45; }
  .card { background: var(--card); padding: 1rem; box-shadow: inset 0 0 0 1px var(--line); margin-bottom: .75rem; }
  .wide { width: 100%; font-weight: 700; }
  .teal { background: var(--teal); color: var(--on); }
  .ink { background: var(--ink); color: var(--paper); }
  .rose { background: var(--rose); color: #fff8f6; }
  .ghost { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  input, textarea { width: 100%; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: .9rem; padding: .75rem; margin-bottom: .5rem; }
  textarea { min-height: 6rem; }
  .chips { display: flex; gap: .4rem; overflow: auto; margin-bottom: .6rem; }
  .chip { border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); padding: .45rem .75rem; white-space: nowrap; }
  .chip.on { background: var(--teal); color: var(--on); box-shadow: none; }
  .note { background: var(--soft); border-radius: .9rem; padding: .7rem .8rem; margin-bottom: .6rem; }
  .speak { background: var(--ink); color: var(--paper); border-radius: .9rem; padding: .7rem .8rem; margin-bottom: .6rem; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: .5rem 1rem max(.6rem, env(safe-area-inset-bottom)); }
  footer .wrap { max-width: 32rem; margin: 0 auto; display: grid; gap: .4rem; }
  .hide { display: none; }
  ol { margin: .4rem 0 0; padding-left: 1.1rem; }
  html[data-theme="night"] { --paper:#141311; --ink:#f4efe8; --card:#241f1b; --line:#3c342c; --muted:#b7ab9e; --teal:#3dbaad; --soft:#1a3330; --rose:#e08a82; --rose-soft:#3a2422; --on:#06221f; }
  .tools { display:flex; flex-wrap:wrap; gap:.4rem; margin:.4rem 0 .6rem; }
  #sound { margin: 0 0 .7rem; }
  #sound .pick { min-height: 3.4rem; text-align: left; }
  #sound .pick.on-speaker { background: var(--teal); color: var(--on); border-color: transparent; }
  #sound .pick.on-call { background: var(--rose); color: var(--on); border-color: transparent; }
  #sound .sub { display: block; font-size: .75rem; font-weight: 500; opacity: .85; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <button id="home" class="ghost" type="button" style="display:none;margin-bottom:.4rem">Home</button>
      <p class="kicker">SteadyVoice</p>
      <h1 id="title">Home</h1>
    </div>
  </div>
  <div id="sound"></div>
  <nav class="tabs" aria-label="Sections" style="display:none">
    <button class="tab on" data-tab="board" type="button">Board</button>
    <button class="tab" data-tab="say" type="button">Speak</button>
    <button class="tab" data-tab="call" type="button">Call</button>
    <button class="tab" data-tab="more" type="button">More</button>
  </nav>
  <div id="live" class="hide" aria-live="polite"></div>
  <section id="view"></section>
  <footer>
    <div class="wrap">
      <div class="dock">
        <button class="ghost" data-say="Yes." type="button">Yes</button>
        <button class="rose" data-say="No." type="button">No</button>
        <button class="teal" data-say="Please wait. I need a moment." type="button">Wait</button>
        <button class="rose" data-say="I need help." type="button">Help</button>
      </div>
      <div class="dock" style="grid-template-columns:1fr 1fr">
        <button id="stop" class="ghost" type="button">Stop</button>
        <button id="again" class="ghost" type="button">Say last again</button>
      </div>
    </div>
  </footer>
<script>
const PHRASES = [
  ["help","Help","I need help.","Urgent","urgent"],
  ["cant","I can't speak","I had a stroke. I can hear you. I cannot speak right now. Please listen to this voice.","Urgent","urgent"],
  ["emergency","Emergency","This is an emergency. I need medical help.","Urgent","urgent"],
  ["911","Call 911","Please call 911.","Urgent","urgent"],
  ["breathe","Hard to breathe","It is hard to breathe.","Urgent","urgent"],
  ["stop","Stop","Please stop.","Urgent","urgent"],
  ["yes","Yes","Yes.","Talk","talk"],
  ["no","No","No.","Talk","talk"],
  ["wait","Wait","Please wait. I need a moment.","Talk","talk"],
  ["again","Say it again","Please say that again, more slowly.","Talk","talk"],
  ["understand","I don't understand","I do not understand. Please say it a different way.","Talk","talk"],
  ["hear","I can hear you","I can hear you. I just cannot speak.","Talk","talk"],
  ["water","Water","I need water.","Needs","need"],
  ["bathroom","Bathroom","I need the bathroom.","Needs","need"],
  ["pain","Pain","I am in pain.","Needs","urgent"],
  ["medicine","Medicine","I need my medicine.","Needs","need"],
  ["hungry","Hungry","I am hungry.","Needs","need"],
  ["cold","I'm cold","I am cold.","Needs","need"],
  ["tired","I'm tired","I am tired.","Feelings","talk"],
  ["scared","I'm scared","I am scared.","Feelings","urgent"],
  ["okay","I'm okay","I am okay.","Feelings","talk"],
  ["love","I love you","I love you.","Feelings","talk"],
  ["thanks","Thank you","Thank you.","Feelings","talk"],
  ["nurse","Nurse","I need the nurse.","People","need"],
  ["doctor","Doctor","I need the doctor.","People","need"],
  ["family","My family","Please call my family.","People","need"],
  ["dizzy","Dizzy","I feel dizzy.","Care","urgent"],
  ["head","Headache","I have a headache.","Care","need"]
].map(([id,label,speak,group,tone]) => ({id,label,speak,group,tone}));
const PRESETS = [
  ["clara","Clara","Clear and steady",0.86,1.05],
  ["helen","Helen","Warm and lower",0.8,0.92],
  ["june","June","Brighter",0.92,1.16],
  ["mae","Mae","Soft",0.76,1],
  ["nora","Nora","Slow, for calls",0.68,1.02]
].map(([id,name,hint,rate,pitch]) => ({id,name,hint,rate,pitch}));
const FEMALE = /female|woman|samantha|victoria|karen|moira|tessa|fiona|zira|hazel|jenny|aria|emma|libby|sonia|allison|ava|serena|kate|salli|joanna|ivy|melissa|amy|olivia|susan|nicky/i;
const MALE = /\bmale\b|\bdavid\b|\bdaniel\b|\balex\b|\bfred\b|\bguy\b|\bgeorge\b|\bmatthew\b|\bjoey\b/i;
const KEY = "steadyvoice.call.v2";
const $= (s,r=document) => r.querySelector(s);
const view = $("#view");
let tab = "menu", group = "All", query = "", draft = "", speaking = "", notice = "", arranging = false, soundOpen = false, detectedCall = false, guideOn = false, guideStep = 0;
let state = load();
function talkStamp(at){ return new Date(at).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }
function ensureTalks(){
  if (!Array.isArray(state.talks)) state.talks = [];
  if (!state.talks.some(talk => talk && talk.id === state.currentId)){
    const at = Date.now();
    const fresh = {id:"talk-"+at, title:talkStamp(at), at:at, lines:[]};
    state.talks.unshift(fresh);
    state.currentId = fresh.id;
  }
}
function rememberLine(line){
  ensureTalks();
  const now = Date.now();
  let current = state.talks.find(talk => talk.id === state.currentId);
  if (current && current.lines.length){
    const start = new Date(current.at), today = new Date(now);
    if (start.getFullYear() !== today.getFullYear() || start.getMonth() !== today.getMonth() || start.getDate() !== today.getDate()){
      const fresh = {id:"talk-"+now, title:talkStamp(now), at:now, lines:[]};
      state.talks.unshift(fresh);
      state.currentId = fresh.id;
      current = fresh;
    }
  }
  current.lines = (current.lines || []).concat(line).slice(-80);
  state.talks = state.talks.filter(talk => (talk.lines && talk.lines.length) || talk.id === state.currentId).slice(0, 40);
}
function replayTalk(id){
  const talk = (state.talks || []).find(item => item.id === id);
  if (!talk || !talk.lines.length || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const shaped = shape();
  const list = voices();
  const voice = list.find(item => item.voiceURI === state.settings.voiceURI) || list[0];
  talk.lines.forEach(line => {
    const utter = new SpeechSynthesisUtterance(line);
    utter.rate = shaped.rate;
    utter.pitch = shaped.pitch;
    utter.volume = 1;
    if (voice) utter.voice = voice;
    speechSynthesis.speak(utter);
  });
}
function saveTalk(){
  ensureTalks();
  const current = state.talks.find(talk => talk.id === state.currentId);
  if (!current || !current.lines.length){ notice = "Nothing to save yet."; render(); return; }
  const at = Date.now();
  const fresh = {id:"talk-"+at, title:talkStamp(at), at:at, lines:[]};
  state.currentId = fresh.id;
  state.talks = [fresh].concat(state.talks.filter(talk => talk.lines && talk.lines.length)).slice(0, 40);
  notice = "Saved. A new talk is ready.";
  openTalk = "";
  save();
  render();
}
ensureTalks();
if (!Array.isArray(state.learned)) state.learned = [];
if (!state.settings.themeChosen){ state.settings.theme = "night"; state.settings.themeChosen = true; save(); }
if (!state.settings.seenTutorial) guideOn = true;
function learn(line){
  const text = String(line || "").trim().slice(0, 180);
  if (!text) return;
  if (!Array.isArray(state.learned)) state.learned = [];
  const index = state.learned.findIndex(item => item && item.text && item.text.toLowerCase() === text.toLowerCase());
  if (index >= 0) state.learned[index].count = (state.learned[index].count || 0) + 1;
  else state.learned.push({text: text, count: 1});
  state.learned.sort((a, b) => (b.count || 0) - (a.count || 0));
  state.learned = state.learned.slice(0, 80);
}
function suggestions(text){
  const queryText = String(text || "").trim().toLowerCase();
  if (!queryText) return [];
  const risky = /911|emergency/i.test(text || "");
  const source = (state.learned || []).filter(item => item && item.text && (risky || !/911|emergency/i.test(item.text)));
  const starts = source.filter(item => item.text.toLowerCase().startsWith(queryText) && item.text.toLowerCase() !== queryText);
  if (starts.length) return starts.slice(0, 5).map(item => item.text);
  const token = queryText.split(/\s+/).pop() || "";
  if (token.length < 2) return [];
  const words = new Map();
  source.forEach(item => item.text.split(/\s+/).forEach(word => {
    const clean = word.replace(/[^a-zA-Z']/g, "");
    const lower = clean.toLowerCase();
    if (clean.length >= 2 && lower.startsWith(token) && lower !== token) words.set(clean, (words.get(clean) || 0) + (item.count || 1));
  }));
  return Array.from(words.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5).map(pair => pair[0]);
}
function load(){
  const blank = {custom:[], hidden:[], uses:{}, history:[], order:[], talks:[], currentId:"", learned:[], settings:{presetId:"nora", voiceURI:"", callMode:false, leadIn:true, name:"", theme:"night", sort:"used", columns:2, showChips:true, showDock:true, output:"auto", mood:50, comedyId:"", themeChosen:false, seenTutorial:false}};
  try { return Object.assign(blank, JSON.parse(localStorage.getItem(KEY)||"null")||{}, {settings:Object.assign(blank.settings,(JSON.parse(localStorage.getItem(KEY)||"{}").settings)||{})}); }
  catch { return blank; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
function liveCall(){
  const output = state.settings.output || "auto";
  return output === "call" || (output === "auto" && detectedCall);
}
async function applyRoute(){
  const on = liveCall();
  state.settings.callMode = on;
  try { if (navigator.audioSession) navigator.audioSession.type = on ? "play-and-record" : "playback"; } catch {}
  try { if (on && navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch {}
}
function renderSound(){
  const box = $("#sound");
  if (!box) return;
  const onCall = liveCall();
  const output = state.settings.output || "auto";
  const extra = soundOpen ? `<div class="card">
      <button class="wide ${output==="auto"?"ink":"ghost"}" data-out="auto" type="button">${output==="auto"?"Auto is on":"Auto is off"} — follow a phone call</button>
      <button class="wide ghost" id="sound-lead" type="button" style="margin-top:.4rem">${state.settings.leadIn ? "On a call, starts with Please listen" : "On a call, phrase only"}</button>
      <button class="wide teal" id="sound-test" type="button" style="margin-top:.4rem">Test this sound</button>
      <p class="muted">On the phone’s call screen, tap Speaker and turn the volume up. A computer uses its current speaker.</p>
    </div>` : "";
  const hint = output === "auto" && detectedCall ? `<p class="muted">A call took the sound. Tap Speaker to override.</p>` : "";
  box.innerHTML = `<div class="grid">
      <button class="pick ${onCall ? "" : "on-speaker"}" data-out="speaker" type="button">Speaker<span class="sub">${output==="auto" && !onCall ? "Auto · out loud" : "Out loud"}</span></button>
      <button class="pick ${onCall ? "on-call" : ""}" data-out="call" type="button">Phone call<span class="sub">${output==="auto" && onCall ? "Auto · on the line" : "On the line"}</span></button>
    </div>${hint}
    <button class="wide ghost" id="sound-more" type="button" style="margin-top:.35rem">${soundOpen ? "Hide sound options" : "Sound options"}</button>${extra}`;
}
function phrases(){ return PHRASES.concat(state.custom||[]); }
function preset(){ return PRESETS.find(p => p.id === state.settings.presetId) || PRESETS[4]; }
const COMEDY = [
  {id:"sweet", name:"Sweet", rate:0.84, pitch:1.22},
  {id:"giggle", name:"Giggle", rate:1.05, pitch:1.38},
  {id:"drama", name:"Drama", rate:0.68, pitch:0.82},
  {id:"grumpy", name:"Grumpy", rate:0.96, pitch:0.7}
];
let folds = {};
function shape(){
  const comedy = COMEDY.find(item => item.id === state.settings.comedyId);
  const base = comedy || preset();
  const mood = Math.min(100, Math.max(0, Number(state.settings.mood)));
  const safe = Number.isFinite(mood) ? mood : 50;
  return {
    rate: Math.min(1.35, Math.max(0.5, base.rate * (1 + (safe - 50) / 280))),
    pitch: Math.min(2, Math.max(0.45, base.pitch * (1 + (50 - safe) / 180)))
  };
}
function fold(id, label, inner){
  const open = !!folds[id];
  return `<button class="wide ghost" data-fold="${id}" type="button" style="margin-top:.7rem">${open ? "Hide " + label : label}</button>` + (open ? `<div class="card">${inner}</div>` : "");
}
function voices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const en = all.filter(v => v.lang.toLowerCase().startsWith("en"));
  const pool = en.length ? en : all;
  const women = pool.filter(v => FEMALE.test(v.name) && !MALE.test(v.name));
  return women.length ? women : pool.filter(v => !MALE.test(v.name));
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === "\"") return "&" + "quot;";
    return "&" + "#39;";
  });
}
function say(text){
  const clean = text.trim();
  if (!clean || !window.speechSynthesis){ notice = "Open this file in Chrome so the phone can speak."; render(); return; }
  if (navigator.vibrate) navigator.vibrate(12);
  state.history = [clean].concat((state.history||[]).filter(x => x !== clean)).slice(0,12);
  const hit = phrases().find(p => p.speak === clean);
  state.uses = state.uses || {};
  if (hit) state.uses[hit.id] = (state.uses[hit.id] || 0) + 1;
  rememberLine(clean);
  learn(clean);
  save();
  speechSynthesis.cancel();
  const shaped = shape();
  const list = voices();
  const voice = list.find(v => v.voiceURI === state.settings.voiceURI) || list[0];
  const onCall = liveCall();
  const make = (line) => { const u = new SpeechSynthesisUtterance(line); u.rate = onCall ? Math.min(shaped.rate, 0.8) : shaped.rate; u.pitch = shaped.pitch; u.volume = 1; if (voice) u.voice = voice; return u; };
  speaking = clean;
  const last = make(clean);
  last.onend = last.onerror = () => { speaking = ""; render(); };
  setTimeout(() => {
    speechSynthesis.resume();
    if (onCall && state.settings.leadIn) speechSynthesis.speak(make("Please listen."));
    speechSynthesis.speak(last);
  }, 60);
  applyRoute();
  render();
}
function textIt(text){ location.href = "sms:?&body=" + encodeURIComponent(text); }
function wa(text){ open("https://wa.me/?text=" + encodeURIComponent(text)); }
function render(){
  document.documentElement.dataset.theme = state.settings.theme === "paper" ? "paper" : "night";
  renderSound();
  const speakingScreen = tab === "board" || tab === "say" || tab === "call";
  const sound = $("#sound");
  if (sound) sound.style.display = speakingScreen ? "" : "none";
  const footer = document.querySelector("footer");
  if (footer) footer.style.display = speakingScreen ? "" : "none";
  const home = $("#home");
  if (home) home.style.display = tab === "menu" ? "none" : "";
  const dock = document.querySelector("footer .dock");
  if (dock) dock.style.display = tab === "board" && state.settings.showDock !== false ? "" : "none";
  $("#title").textContent = tab === "menu" ? "Home" : tab === "call" ? "On a call" : tab === "say" ? "Type" : tab === "more" ? "Voices and look" : "Say a phrase";
  const banner = (notice ? `<p class="note">${esc(notice)}</p>` : "") + (speaking ? `<p class="speak">Speaking: ${esc(speaking)}</p>` : "");
  const steps = [
    "Tap a phrase. This phone says it for you.",
    "Speaker is for people in the room. Phone call is for someone on the phone.",
    "If the words are not on a button, type them, then tap Say it. Words she has said before will be offered.",
    "Tap Home to come back here. Tap Stop if the voice should be quiet."
  ];
  const guide = guideOn ? `<div class="card" style="position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:8"><p class="kicker">Step ${guideStep + 1} of 4</p><p style="font-size:1.2rem;font-weight:650">${esc(steps[guideStep] || "")}</p><button class="wide teal" id="guide-next" type="button">${guideStep >= 3 ? "Done" : "Next"}</button><button class="wide ghost" id="guide-skip" type="button">Skip</button></div>` : "";
  if (tab === "menu") view.innerHTML = banner + menu() + guide;
  else if (tab === "board") view.innerHTML = banner + board() + guide;
  else if (tab === "say") view.innerHTML = banner + typer() + guide;
  else if (tab === "call") view.innerHTML = banner + call() + guide;
  else view.innerHTML = banner + more() + guide;
}
function menu(){
  const rows = [
    ["board", "Say a phrase", "Tap a button. The phone says the whole sentence."],
    ["say", "Type a sentence", "Write words that are not on a button."],
    ["call", "Phone call", "So the person on the line can hear her."],
    ["talks", "Conversations", "Open an earlier talk and say it again."],
    ["more", "Voices and look", "Change the voice, the size, or the dark screen."],
    ["guide", "Show me how", "Four short steps. You can come back anytime."]
  ];
  return rows.map(row => `<button class="wide" data-go="${row[0]}" type="button" style="display:block;width:100%;text-align:left;margin-bottom:.45rem"><b>${row[1]}</b><br><span class="muted">${row[2]}</span></button>`).join("")
    + `<button class="wide ghost" data-go="emergency" type="button" style="display:block;width:100%;text-align:left;margin-top:1rem"><b>Emergency</b><br><span class="muted">Only if she needs help right now.</span></button>`;
}
function shown(){
  const hidden = new Set(state.hidden || []);
  const list = phrases().filter(p => !hidden.has(p.id) && p.id !== "emergency" && p.id !== "911" && (group === "All" || p.group === group) && (!query || (p.label+" "+p.speak).toLowerCase().includes(query.toLowerCase())));
  const uses = state.uses || {};
  const order = state.order || [];
  const rank = new Map(order.map((id, i) => [id, i]));
  const mode = state.settings.sort || "used";
  return list.sort((a, b) => {
    if (mode === "az") return a.label.localeCompare(b.label);
    if (mode === "group") return a.group.localeCompare(b.group) || a.label.localeCompare(b.label);
    if (mode === "manual") return (rank.get(a.id) ?? 999) - (rank.get(b.id) ?? 999);
    return (uses[b.id] || 0) - (uses[a.id] || 0);
  });
}
function move(id, dir){
  const list = shown().map(p => p.id);
  const i = list.indexOf(id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const hold = list[i]; list[i] = list[j]; list[j] = hold;
  const full = (state.order || []).concat(phrases().map(p => p.id));
  const seen = new Set();
  const base = full.filter(x => seen.has(x) ? false : (seen.add(x), true));
  let cursor = 0;
  state.order = base.map(item => list.includes(item) ? list[cursor++] : item);
  state.settings.sort = "manual";
  save();
  render();
}
function board(){
  const groups = ["All","Urgent","Needs","Feelings","Talk","People","Care"];
  const list = shown();
  const sorts = [["used","Most used"],["az","A–Z"],["group","Group"],["manual","My order"]];
  const tools = arranging ? `<div class="card"><p>Arrange is on. These buttons will not speak.</p>
    <button class="wide teal" id="done" type="button">Done</button>
    <div class="tools">${sorts.map(([id,label]) => `<button class="chip${state.settings.sort===id?" on":""}" data-sort="${id}" type="button">${label}</button>`).join("")}</div>
    <div class="tools">
      <button class="chip" id="theme" type="button">${state.settings.theme==="night"?"Dark on":"Dark off"}</button>
      <button class="chip" id="cols" type="button">${state.settings.columns||2} columns</button>
      <button class="chip" id="chips" type="button">${state.settings.showChips===false?"Groups off":"Groups on"}</button>
      <button class="chip" id="dock" type="button">${state.settings.showDock===false?"Yes/No bar off":"Yes/No bar on"}</button>
    </div></div>` : `<p class="muted">Tap a button. The phone says the full sentence.</p>`;
  const chips = state.settings.showChips === false ? "" : `<div class="chips">${groups.map(g => `<button class="chip${g===group?" on":""}" data-group="${g}" type="button">${g}</button>`).join("")}</div>`;
  const cols = state.settings.columns === 1 ? "1fr" : state.settings.columns === 3 ? "1fr 1fr 1fr" : "1fr 1fr";
  const cards = list.map((p, index) => arranging
    ? `<div class="pad ${p.tone}"><b>${esc(p.label)}</b><div class="tools"><button class="chip" data-move="${esc(p.id)}" data-dir="-1" type="button" ${index===0?"disabled":""}>Up</button><button class="chip" data-move="${esc(p.id)}" data-dir="1" type="button" ${index===list.length-1?"disabled":""}>Down</button><button class="chip" data-hide="${esc(p.id)}" type="button">Hide</button></div></div>`
    : `<button class="pad ${p.tone}" data-speak="${esc(p.speak)}" type="button"><b>${esc(p.label)}</b><span>${esc(p.group)}</span></button>`).join("");
  const hidden = (state.hidden||[]).map(id => phrases().find(p => p.id === id)).filter(Boolean);
  const back = arranging && hidden.length ? `<p class="kicker">Hidden</p>` + hidden.map(p => `<button class="wide ghost" data-show="${esc(p.id)}" type="button">Put back: ${esc(p.label)}</button>`).join("") : "";
  const note = !arranging && state.settings.comedyId ? `<button class="wide" id="reset-voice" type="button" style="margin-bottom:.5rem">Playing ${esc((COMEDY.find(item => item.id === state.settings.comedyId)||{}).name || "a play voice")}. Tap for her normal voice.</button>` : "";
  const boardOpts = arranging ? "" : fold("board", "Board options", `<p class="muted">To move, hide, or restyle buttons, open More and then Arrange.</p>`);
  const tucked = phrases().filter(p => (p.id === "emergency" || p.id === "911") && !(state.hidden||[]).includes(p.id));
  const emergency = tucked.length ? fold("emergency", "Emergency", `<p class="muted">Tucked here so a tap on the board cannot start them.</p><div class="grid" style="margin-top:.4rem">${tucked.map(p => `<button class="pad urgent" data-speak="${esc(p.speak)}" type="button"><b>${esc(p.label)}</b></button>`).join("")}</div>`) : "";
  return `${note}${tools}<input id="q" placeholder="Search" value="${esc(query)}" aria-label="Search">${chips}<div class="grid" style="grid-template-columns:${cols}">${cards}</div>${back}${emergency}${boardOpts}`;
}
function typer(){
  const mood = Number(state.settings.mood);
  const moodSafe = Number.isFinite(mood) ? mood : 50;
  const word = moodSafe < 35 ? "Soft" : moodSafe > 65 ? "Harsh" : "Natural";
  const comedy = state.settings.comedyId || "";
  const chips = [{id:"", name:"Normal"}].concat(COMEDY).map(item => `<button class="chip${comedy===item.id?" on":""}" data-comedy="${item.id}" type="button">${item.name}</button>`).join("");
  const options = fold("speak", "Speak options", `<button class="wide ghost" id="do-wa" type="button">Send in WhatsApp</button><div class="chips" style="margin-top:.6rem">${["I","need","please","help","water","pain","yes","no"].map(w => `<button class="chip" data-word="${w}" type="button">${w}</button>`).join("")}</div>`);
  const ideas = suggestions(draft).map(item => `<button class="chip" data-suggest="${esc(item)}" type="button">${esc(item)}</button>`).join("");
  return `<label for="box">What should the phone say?</label>
    <textarea id="box">${esc(draft)}</textarea>
    ${ideas ? `<div class="chips" style="margin:.4rem 0 .6rem">${ideas}</div>` : ""}
    <div class="row" style="align-items:center;gap:.4rem"><span class="muted">Soft</span><input id="mood" type="range" min="0" max="100" value="${moodSafe}" aria-label="Mood, from soft to harsh" style="flex:1;accent-color:#0e6b62"><span class="muted">Harsh</span></div>
    <p class="muted" id="mood-word">${word}</p>
    <p style="margin:.4rem 0 .2rem;font-weight:600">Play voices</p>
    <div class="chips">${chips}</div>
    <div class="grid"><button class="wide teal" id="do-say" type="button">Say it</button><button class="wide ink" id="do-text" type="button">Text it</button></div>
    ${options}`;
}
function call(){
  return `<div class="card"><h2 style="margin:.1rem 0 .4rem">So the other person can hear her</h2>
    <p>Tap Phone call at the top. On the call screen, tap Speaker, turn the volume up, and hold the phone a little away. She is heard through the microphone.</p></div>
    <button class="wide teal" data-speak="Can you hear me? I am using SteadyVoice because I cannot speak." type="button">Test: Can you hear me?</button>
    <div class="grid" style="margin-top:.7rem">${phrases().filter(p => p.id !== "emergency" && p.id !== "911").slice(0,8).map(p => `<button class="pad" data-speak="${esc(p.speak)}" type="button"><b>${esc(p.label)}</b></button>`).join("")}</div>
    ${fold("call", "Call options", `<button class="wide ghost" id="lead" type="button">${state.settings.leadIn ? "Starts with Please listen" : "Phrase only"}</button><div class="voices" style="margin-top:.5rem">${PRESETS.map(p => `<button class="voice${p.id===state.settings.presetId?" on":""}" data-preset="${p.id}" type="button"><b>${p.name}</b></button>`).join("")}</div>`)}`;
}
let openTalk = "";
function more(){
  const women = voices();
  ensureTalks();
  if (openTalk){
    const talk = state.talks.find(item => item.id === openTalk);
    if (talk) return `<button class="wide ghost" id="close-talk" type="button">Back</button>
      <h2 style="margin:.6rem 0 .3rem">${esc(talk.title)}</h2>
      <button class="wide teal" id="replay-open" type="button">Say this talk again</button>
      ${talk.lines.map(line => `<button class="wide ghost" data-speak="${esc(line)}" type="button" style="margin-top:.4rem">${esc(line)}</button>`).join("")}
      <button class="wide" id="delete-talk" type="button" style="margin-top:.7rem">Delete this talk</button>`;
    openTalk = "";
  }
  const current = state.talks.find(item => item.id === state.currentId) || {title:"", lines:[]};
  const earlier = state.talks.filter(item => item.id !== state.currentId && item.lines && item.lines.length);
  const recent = current.lines.slice(-4).map(line => `<p class="muted">${esc(line)}</p>`).join("") || `<p class="muted">Nothing yet. Tap a button and it will show up here.</p>`;
  const old = earlier.map(item => `<button class="wide ghost" data-open-talk="${esc(item.id)}" type="button" style="margin-top:.4rem"><b>${esc(item.title)}</b><br><span class="muted">${item.lines.length} lines · ${esc(item.lines[0])}</span></button>`).join("");
  return `<div class="card"><b>Conversations</b><p>What she says is kept on this phone, in order. Save a talk to start a fresh one and still say the old one later.</p>
    <p><b>This talk</b> · ${esc(current.title || "")}</p>
    ${recent}
    <button class="wide teal" id="replay-current" type="button" ${current.lines.length ? "" : "disabled"}>Say this talk again</button>
    <button class="wide ink" id="save-talk" type="button" style="margin-top:.4rem" ${current.lines.length ? "" : "disabled"}>Save and start a new talk</button>
    ${current.lines.length ? `<button class="wide ghost" data-open-talk="${esc(state.currentId)}" type="button" style="margin-top:.4rem">See every line</button>` : ""}
    ${old ? `<p class="kicker" style="margin-top:.8rem">Earlier</p>${old}` : ""}
  </div>
    <div class="card"><b>Women's voices</b><p>Clara, Helen, June, Mae, and Nora use the best woman's voice on this phone. ${women.length ? "Found: " + esc(women.map(v=>v.name).slice(0,4).join(", ")) : "No woman's voice yet. In the phone settings, download an English woman's text-to-speech voice, then reopen this page."}</p>
    <div class="voices">${PRESETS.map(p => `<button class="voice${p.id===state.settings.presetId?" on":""}" data-preset="${p.id}" data-preview="1" type="button">${p.name}</button>`).join("")}</div></div>
    <div class="card"><b>Text a phrase</b><p>Text opens the phone's own Messages app with the words filled in. She taps Send. WhatsApp does the same if it is installed. A new messaging app is not required.</p>
    <button class="wide ink" data-speak="" data-text="I had a stroke. I can hear you. I cannot speak. Please read this text." type="button">Text: I cannot speak</button></div>
    <div class="card"><b>Put it on the phone</b><p>An iPhone cannot install a random downloaded app. The simple way is Add to Home Screen from Chrome or Safari. Or send this one file, save it in Downloads, and open it with Chrome. Do not open it from inside a zip.</p></div>
    <button class="wide ink" id="unlock" type="button">Arrange the board</button>
    <p class="muted">Arrange is locked until you tap that. Done locks it again. Nothing is uploaded.</p>
    ${fold("more", "More options", `<label>Her name<input id="name" value="${esc(state.settings.name||"")}" placeholder="First name"></label>`)}`;
}
view.addEventListener("click", (event) => {
  const t = event.target.closest("button");
  if (!t) return;
  if (t.dataset.go){
    if (t.dataset.go === "guide"){ guideOn = true; guideStep = 0; render(); return; }
    if (t.dataset.go === "talks"){ tab = "more"; openTalk = ""; render(); return; }
    if (t.dataset.go === "emergency"){ tab = "board"; folds.emergency = true; render(); return; }
    tab = t.dataset.go;
    render();
    return;
  }
  if (t.dataset.suggest){
    const suggestion = t.dataset.suggest;
    const current = draft.trim();
    if (!current || suggestion.toLowerCase().startsWith(current.toLowerCase())) draft = suggestion;
    else {
      const parts = current.split(/\s+/);
      parts[parts.length - 1] = suggestion;
      draft = parts.join(" ") + " ";
    }
    render();
    const box = $("#box");
    if (box) box.focus();
    return;
  }
  if (t.id === "guide-next"){
    if (guideStep >= 3){ guideOn = false; state.settings.seenTutorial = true; save(); }
    else guideStep += 1;
    render();
    return;
  }
  if (t.id === "guide-skip"){ guideOn = false; state.settings.seenTutorial = true; save(); render(); return; }
  if (t.dataset.fold){ folds[t.dataset.fold] = !folds[t.dataset.fold]; render(); return; }
  if (t.id === "replay-current"){ replayTalk(state.currentId); return; }
  if (t.id === "replay-open"){ replayTalk(openTalk); return; }
  if (t.id === "save-talk"){ saveTalk(); return; }
  if (t.id === "close-talk"){ openTalk = ""; render(); return; }
  if (t.id === "delete-talk"){
    state.talks = (state.talks || []).filter(item => item.id !== openTalk);
    if (openTalk === state.currentId) state.currentId = "";
    openTalk = "";
    ensureTalks();
    save();
    render();
    return;
  }
  if (t.dataset.openTalk){ openTalk = t.dataset.openTalk; render(); return; }
  if (t.dataset.comedy !== undefined){
    state.settings.comedyId = t.dataset.comedy;
    save();
    if (t.dataset.comedy && !liveCall()){
      const picked = COMEDY.find(item => item.id === t.dataset.comedy);
      say("Hello. This is the " + (picked ? picked.name : "play") + " voice.");
    } else render();
    return;
  }
  if (t.id === "reset-voice"){ state.settings.comedyId = ""; state.settings.mood = 50; save(); render(); return; }
  if (t.id === "unlock"){ arranging = true; tab = "board"; render(); return; }
  if (t.id === "done"){ arranging = false; render(); return; }
  if (t.id === "theme"){ state.settings.theme = state.settings.theme === "night" ? "paper" : "night"; save(); render(); return; }
  if (t.id === "cols"){ state.settings.columns = state.settings.columns === 1 ? 2 : state.settings.columns === 2 ? 3 : 1; save(); render(); return; }
  if (t.id === "chips"){ state.settings.showChips = state.settings.showChips === false; save(); render(); return; }
  if (t.id === "dock"){ state.settings.showDock = state.settings.showDock === false; save(); render(); return; }
  if (t.dataset.sort){ state.settings.sort = t.dataset.sort; save(); render(); return; }
  if (t.dataset.move){ move(t.dataset.move, Number(t.dataset.dir)); return; }
  if (t.dataset.hide){ state.hidden = (state.hidden||[]).concat(t.dataset.hide); save(); render(); return; }
  if (t.dataset.show){ state.hidden = (state.hidden||[]).filter(id => id !== t.dataset.show); save(); render(); return; }
  if (t.dataset.group){ group = t.dataset.group; render(); return; }
  if (t.dataset.speak !== undefined && t.dataset.speak){ say(t.dataset.speak); return; }
  if (t.dataset.text){ textIt(t.dataset.text); return; }
  if (t.dataset.preset){
    state.settings.presetId = t.dataset.preset;
    save();
    if (t.dataset.preview) say("Hello. This is " + preset().name + ". I am here with you.");
    else render();
    return;
  }
  if (t.dataset.word){ draft = (draft ? draft.trim() + " " : "") + t.dataset.word; render(); const box = $("#box"); if (box) box.focus(); return; }
  if (t.id === "do-say") say(draft);
  if (t.id === "do-text" && draft.trim()) textIt(draft.trim());
  if (t.id === "do-wa" && draft.trim()) wa(draft.trim());
  if (t.id === "lead"){ state.settings.leadIn = !state.settings.leadIn; save(); render(); }
});
view.addEventListener("input", (event) => {
  if (event.target.id === "q"){ query = event.target.value; const pos = event.target.selectionStart; render(); const q = $("#q"); if (q){ q.focus(); q.selectionStart = q.selectionEnd = pos; } }
  if (event.target.id === "box") draft = event.target.value;
  if (event.target.id === "mood"){
    state.settings.mood = Number(event.target.value);
    const word = state.settings.mood < 35 ? "Soft" : state.settings.mood > 65 ? "Harsh" : "Natural";
    const label = $("#mood-word");
    if (label) label.textContent = word;
    save();
  }
  if (event.target.id === "name"){ state.settings.name = event.target.value; save(); }
});
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; notice = ""; render(); });
$("#sound").addEventListener("click", (event) => {
  const t = event.target.closest("button");
  if (!t) return;
  if (t.id === "sound-more"){ soundOpen = !soundOpen; renderSound(); return; }
  if (t.id === "sound-lead"){ state.settings.leadIn = !state.settings.leadIn; save(); renderSound(); return; }
  if (t.id === "sound-test"){ say("This is SteadyVoice. Can you hear me?"); return; }
  if (t.dataset.out){
    state.settings.output = t.dataset.out;
    if (t.dataset.out !== "auto") soundOpen = false;
    save();
    applyRoute();
    render();
  }
});
$("#stop").onclick = () => { speechSynthesis.cancel(); speaking = ""; render(); };
$("#home").onclick = () => { tab = "menu"; arranging = false; openTalk = ""; notice = ""; render(); };
$("#again").onclick = () => { if (state.history[0]) say(state.history[0]); };
document.body.addEventListener("click", (event) => {
  const t = event.target.closest("[data-say]");
  if (t && t.closest("footer")) say(t.dataset.say);
});
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (tab === "more" || tab === "call") render(); };
if (navigator.audioSession && navigator.audioSession.addEventListener) {
  navigator.audioSession.addEventListener("statechange", () => {
    const next = navigator.audioSession.state === "interrupted";
    if (next === detectedCall) return;
    detectedCall = next;
    if ((state.settings.output || "auto") === "auto") notice = next ? "A call took over the sound. Phone call is on." : "Sound is back on the speaker.";
    applyRoute();
    render();
  });
}
applyRoute();
render();
</script>
</body>
</html>
