<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee6">
<link rel="manifest" href="manifest.webmanifest">
<title>SteadyVoice</title>
<style>
  :root { color-scheme: light; --paper:#f3eee6; --ink:#1c1916; --card:#fffdf9; --line:#e4d9cc; --muted:#6d645b; --teal:#0e6b62; --soft:#e5f3f1; --rose:#8e2f2f; --rose-soft:#f8e8e4; --on:#f3fffc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Helvetica Neue", sans-serif; }
  body { max-width: 32rem; margin: 0 auto; min-height: 100dvh; padding: max(1rem, env(safe-area-inset-top)) 1rem 8.5rem; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; }
  h1 { font-size: 1.6rem; margin: 0; }
  .kicker { margin: 0; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; gap: .75rem; }
  .tabs, .grid, .dock, .voices { display: grid; gap: .5rem; }
  .tabs { grid-template-columns: repeat(4, 1fr); margin: .75rem 0; }
  .grid, .voices { grid-template-columns: 1fr 1fr; }
  .dock { grid-template-columns: repeat(4, 1fr); }
  button, .card { border-radius: 1rem; }

  .tab { background: var(--card); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); font-weight: 650; }
  .tab.on, .voice.on { background: var(--ink); color: var(--paper); box-shadow: none; }
  .callbtn { border-radius: 999px; min-height: 3rem; padding: 0 1rem; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; }
  .callbtn.on { background: var(--teal); color: var(--on); box-shadow: none; }
  .pad { min-height: 5rem; padding: .75rem; text-align: left; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .pad b { display: block; font-size: 1.05rem; }
  .pad span, .muted, .card p { color: var(--muted); }
  .pad.urgent { background: var(--rose); color: #fff8f6; box-shadow: none; }
  .pad.urgent span { color: #f8e8e4; }
  .pad.need { background: var(--soft); }
  .lead, .card { font-size: .95rem; line-height: 1.45; }
  .card { background: var(--card); padding: 1rem; box-shadow: inset 0 0 0 1px var(--line); margin-bottom: .75rem; }
  .wide { width: 100%; font-weight: 700; }
  .teal { background: var(--teal); color: var(--on); }
  .ink { background: var(--ink); color: var(--paper); }
  .rose { background: var(--rose); color: #fff8f6; }
  .ghost { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  input, textarea { width: 100%; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: .9rem; padding: .75rem; margin-bottom: .5rem; }
  textarea { min-height: 6rem; }
  .chips { display: flex; gap: .4rem; overflow: auto; margin-bottom: .6rem; }
  .chip { border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); padding: .45rem .75rem; white-space: nowrap; }
  .chip.on { background: var(--teal); color: var(--on); box-shadow: none; }
  .note { background: var(--soft); border-radius: .9rem; padding: .7rem .8rem; margin-bottom: .6rem; }
  .speak { background: var(--ink); color: var(--paper); border-radius: .9rem; padding: .7rem .8rem; margin-bottom: .6rem; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: .5rem 1rem max(.6rem, env(safe-area-inset-bottom)); }
  footer .wrap { max-width: 32rem; margin: 0 auto; display: grid; gap: .4rem; }
  .hide { display: none; }
  ol { margin: .4rem 0 0; padding-left: 1.1rem; }
  html[data-theme="night"] { --paper:#141311; --ink:#f4efe8; --card:#241f1b; --line:#3c342c; --muted:#b7ab9e; --teal:#3dbaad; --soft:#1a3330; --rose:#e08a82; --rose-soft:#3a2422; --on:#06221f; }
  .tools { display:flex; flex-wrap:wrap; gap:.4rem; margin:.4rem 0 .6rem; }
  #sound { margin: 0 0 .7rem; }
  #sound .pick { min-height: 3.4rem; text-align: left; }
  #sound .pick.on-speaker { background: var(--teal); color: var(--on); border-color: transparent; }
  #sound .pick.on-call { background: var(--rose); color: var(--on); border-color: transparent; }
  #sound .sub { display: block; font-size: .75rem; font-weight: 500; opacity: .85; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <button id="home" class="ghost" type="button" style="display:none;margin-bottom:.4rem">Home</button>
      <p class="kicker">SteadyVoice</p>
      <h1 id="title">Home</h1>
    </div>
  </div>
  <div id="sound"></div>
  <nav class="tabs" aria-label="Sections" style="display:none">
    <button class="tab on" data-tab="board" type="button">Board</button>
    <button class="tab" data-tab="say" type="button">Speak</button>
    <button class="tab" data-tab="call" type="button">Call</button>
    <button class="tab" data-tab="more" type="button">More</button>
  </nav>
  <div id="live" class="hide" aria-live="polite"></div>
  <section id="view"></section>
  <footer>
    <div class="wrap">
      <div class="dock">
        <button class="ghost" data-say="Yes." type="button">Yes</button>
        <button class="rose" data-say="No." type="button">No</button>
        <button class="teal" data-say="Please wait. I need a moment." type="button">Wait</button>
        <button class="rose" data-say="I need help." type="button">Help</button>
      </div>
      <div class="dock" style="grid-template-columns:1fr 1fr">
        <button id="stop" class="ghost" type="button">Stop</button>
        <button id="again" class="ghost" type="button">Say last again</button>
      </div>
    </div>
  </footer>
<script>
const PHRASES = [
  ["help","Help","I need help.","Urgent","urgent"],
  ["cant","I can't speak","I had a stroke. I can hear you. I cannot speak right now. Please listen to this voice.","Urgent","urgent"],
  ["emergency","Emergency","This is an emergency. I need medical help.","Urgent","urgent"],
  ["911","Call 911","Please call 911.","Urgent","urgent"],
  ["breathe","Hard to breathe","It is hard to breathe.","Urgent","urgent"],
  ["stop","Stop","Please stop.","Urgent","urgent"],
  ["yes","Yes","Yes.","Talk","talk"],
  ["no","No","No.","Talk","talk"],
  ["wait","Wait","Please wait. I need a moment.","Talk","talk"],
  ["again","Say it again","Please say that again, more slowly.","Talk","talk"],
  ["understand","I don't understand","I do not understand. Please say it a different way.","Talk","talk"],
  ["hear","I can hear you","I can hear you. I just cannot speak.","Talk","talk"],
  ["water","Water","I need water.","Needs","need"],
  ["bathroom","Bathroom","I need the bathroom.","Needs","need"],
  ["pain","Pain","I am in pain.","Needs","urgent"],
  ["medicine","Medicine","I need my medicine.","Needs","need"],
  ["hungry","Hungry","I am hungry.","Needs","need"],
  ["cold","I'm cold","I am cold.","Needs","need"],
  ["tired","I'm tired","I am tired.","Feelings","talk"],
  ["scared","I'm scared","I am scared.","Feelings","urgent"],
  ["okay","I'm okay","I am okay.","Feelings","talk"],
  ["love","I love you","I love you.","Feelings","talk"],
  ["thanks","Thank you","Thank you.","Feelings","talk"],
  ["nurse","Nurse","I need the nurse.","People","need"],
  ["doctor","Doctor","I need the doctor.","People","need"],
  ["family","My family","Please call my family.","People","need"],
  ["dizzy","Dizzy","I feel dizzy.","Care","urgent"],
  ["head","Headache","I have a headache.","Care","need"]
].map(([id,label,speak,group,tone]) => ({id,label,speak,group,tone}));
const PRESETS = [
  {id:"clara", name:"Clara", hint:"Clear and steady", rate:0.86, pitch:1.05, kind:"woman"},
  {id:"helen", name:"Helen", hint:"Warm and lower", rate:0.8, pitch:0.92, kind:"woman"},
  {id:"june", name:"June", hint:"Brighter", rate:0.92, pitch:1.16, kind:"woman"},
  {id:"mae", name:"Mae", hint:"Soft", rate:0.76, pitch:1, kind:"woman"},
  {id:"nora", name:"Nora", hint:"Slow, for calls", rate:0.68, pitch:1.02, kind:"woman"},
  {id:"owen", name:"Owen", hint:"Steady man", rate:0.84, pitch:0.72, kind:"man"},
  {id:"caleb", name:"Caleb", hint:"Warm and low", rate:0.76, pitch:0.58, kind:"man"},
  {id:"miles", name:"Miles", hint:"Clear and lighter", rate:0.9, pitch:0.86, kind:"man"},
  {id:"arthur", name:"Arthur", hint:"Slow, for calls", rate:0.64, pitch:0.66, kind:"man"}
];
const FEMALE = /female|woman|samantha|victoria|karen|moira|tessa|fiona|zira|hazel|jenny|aria|emma|libby|sonia|allison|ava|serena|kate|salli|joanna|ivy|melissa|amy|olivia|susan|nicky/i;
const MALE = /\bmale\b|\bdavid\b|\bdaniel\b|\balex\b|\bfred\b|\bguy\b|\bgeorge\b|\bmatthew\b|\bjoey\b|\bjames\b|\bjorge\b|\bdiego\b|\bluca\b|\bpierre\b|\botoya\b|\bthomas\b/i;
const KEY = "steadyvoice.call.v2";
const $= (s,r=document) => r.querySelector(s);
const view = $("#view");
let tab = "menu", group = "All", query = "", draft = "", speaking = "", notice = "", arranging = false, soundOpen = false, detectedCall = false, guideOn = false, guideStep = 0;
let state = load();
function talkStamp(at){ return new Date(at).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }
function ensureTalks(){
  if (!Array.isArray(state.talks)) state.talks = [];
  if (!state.talks.some(talk => talk && talk.id === state.currentId)){
    const at = Date.now();
    const fresh = {id:"talk-"+at, title:talkStamp(at), at:at, lines:[]};
    state.talks.unshift(fresh);
    state.currentId = fresh.id;
  }
}
function rememberLine(line){
  ensureTalks();
  const now = Date.now();
  let current = state.talks.find(talk => talk.id === state.currentId);
  if (current && current.lines.length){
    const start = new Date(current.at), today = new Date(now);
    if (start.getFullYear() !== today.getFullYear() || start.getMonth() !== today.getMonth() || start.getDate() !== today.getDate()){
      const fresh = {id:"talk-"+now, title:talkStamp(now), at:now, lines:[]};
      state.talks.unshift(fresh);
      state.currentId = fresh.id;
      current = fresh;
    }
  }
  current.lines = (current.lines || []).concat(line).slice(-80);
  state.talks = state.talks.filter(talk => (talk.lines && talk.lines.length) || talk.id === state.currentId).slice(0, 40);
}
function replayTalk(id){
  const talk = (state.talks || []).find(item => item.id === id);
  if (!talk || !talk.lines.length || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const shaped = shape();
  const list = voices();
  const voice = list.find(item => item.voiceURI === state.settings.voiceURI) || list[0];
  talk.lines.forEach(line => {
    const utter = new SpeechSynthesisUtterance(line);
    utter.rate = shaped.rate;
    utter.pitch = shaped.pitch;
    utter.volume = 1;
    if (voice) utter.voice = voice;
    speechSynthesis.speak(utter);
  });
}
function saveTalk(){
  ensureTalks();
  const current = state.talks.find(talk => talk.id === state.currentId);
  if (!current || !current.lines.length){ notice = "Nothing to save yet."; render(); return; }
  const at = Date.now();
  const fresh = {id:"talk-"+at, title:talkStamp(at), at:at, lines:[]};
  state.currentId = fresh.id;
  state.talks = [fresh].concat(state.talks.filter(talk => talk.lines && talk.lines.length)).slice(0, 40);
  notice = "Saved. A new talk is ready.";
  openTalk = "";
  save();
  render();
}
ensureTalks();
if (!Array.isArray(state.learned)) state.learned = [];
if (!state.settings.themeChosen){ state.settings.theme = "night"; state.settings.themeChosen = true; save(); }
if (!state.settings.seenTutorial) guideOn = true;
function learn(line){
  const text = String(line || "").trim().slice(0, 180);
  if (!text) return;
  if (!Array.isArray(state.learned)) state.learned = [];
  const index = state.learned.findIndex(item => item && item.text && item.text.toLowerCase() === text.toLowerCase());
  if (index >= 0) state.learned[index].count = (state.learned[index].count || 0) + 1;
  else state.learned.push({text: text, count: 1});
  state.learned.sort((a, b) => (b.count || 0) - (a.count || 0));
  state.learned = state.learned.slice(0, 80);
}
function suggestions(text){
  const queryText = String(text || "").trim().toLowerCase();
  if (!queryText) return [];
  const risky = /911|emergency/i.test(text || "");
  const source = (state.learned || []).filter(item => item && item.text && (risky || !/911|emergency/i.test(item.text)));
  const starts = source.filter(item => item.text.toLowerCase().startsWith(queryText) && item.text.toLowerCase() !== queryText);
  if (starts.length) return starts.slice(0, 5).map(item => item.text);
  const token = queryText.split(/\s+/).pop() || "";
  if (token.length < 2) return [];
  const words = new Map();
  source.forEach(item => item.text.split(/\s+/).forEach(word => {
    const clean = word.replace(/[^a-zA-Z']/g, "");
    const lower = clean.toLowerCase();
    if (clean.length >= 2 && lower.startsWith(token) && lower !== token) words.set(clean, (words.get(clean) || 0) + (item.count || 1));
  }));
  return Array.from(words.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5).map(pair => pair[0]);
}
function typingPack(){
  const from = state.settings.hintFrom || "both";
  const risky = /911|emergency/i.test(draft);
  const safe = (text) => risky || !/911|emergency/i.test(text);
  const query = String(draft || "").trim().toLowerCase();
  const token = query.split(/\s+/).pop() || "";
  const said = (state.learned || []).filter(item => item && item.text && safe(item.text));
  const board = phrases().filter(item => item.id !== "emergency" && item.id !== "911" && safe(item.speak));
  const lines = [];
  const seen = new Set();
  const push = (text) => {
    const key = String(text || "").trim().toLowerCase();
    if (!key || seen.has(key)) return;
    seen.add(key);
    lines.push(String(text).trim());
  };
  if (from !== "board") said.forEach(item => push(item.text));
  if (from !== "said") board.forEach(item => push(item.speak));
  const mineHits = matchingFacts(query);
  const phraseHits = mineHits.concat(query ? lines.filter(line => line.toLowerCase().includes(query) && line.toLowerCase() !== query) : lines).filter((line, index, all) => all.findIndex(item => item.toLowerCase() === line.toLowerCase()) === index).slice(0, 8);
  const counts = new Map();
  const labels = new Map();
  const note = (word, count) => {
    const clean = String(word || "").replace(/[^a-zA-Z']/g, "");
    if (clean.length < 2) return;
    const key = clean.toLowerCase();
    counts.set(key, (counts.get(key) || 0) + count);
    if (!labels.has(key)) labels.set(key, clean);
  };
  if (from !== "board") said.forEach(item => item.text.split(/\s+/).forEach(word => note(word, item.count || 1)));
  if (from !== "said") board.forEach(item => item.speak.split(/\s+/).forEach(word => note(word, 1)));
  ["I","need","want","please","help","water","pain","yes","no","wait","thank"].forEach(word => note(word, 0));
  const wordHits = Array.from(labels.entries()).filter(pair => !token || (pair[0].startsWith(token) && pair[0] !== token)).sort((a, b) => (counts.get(b[0]) || 0) - (counts.get(a[0]) || 0)).slice(0, 8).map(pair => pair[1]);
  return { words: wordHits, phrases: phraseHits };
}
function hintRow(items, kind){
  return `<div class="chips" id="${kind}-line" style="flex-wrap:nowrap;overflow-x:auto">${items.map(item => `<button class="chip" data-suggest="${esc(item)}" data-kind="${kind}" type="button">${esc(item)}</button>`).join("")}</div>`;
}
function load(){
  const blank = {custom:[], hidden:[], uses:{}, history:[], order:[], talks:[], currentId:"", learned:[], settings:{presetId:"nora", voiceURI:"", callMode:false, leadIn:true, name:"", theme:"night", sort:"used", columns:2, showChips:true, showDock:true, output:"auto", mood:50, comedyId:"", themeChosen:false, seenTutorial:false}};
  try { return Object.assign(blank, JSON.parse(localStorage.getItem(KEY)||"null")||{}, {settings:Object.assign(blank.settings,(JSON.parse(localStorage.getItem(KEY)||"{}").settings)||{})}); }
  catch { return blank; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
let noteGen = 0, noteReading = false, noteMark = 0;
function book(){
  const fresh = [
    {id:"1", title:"Slot 1", body:"", place:0},
    {id:"2", title:"Slot 2", body:"", place:0},
    {id:"3", title:"Slot 3", body:"", place:0}
  ];
  const old = state.notes && Array.isArray(state.notes.slots) ? state.notes.slots : [];
  if (!state.notes || old.length < 3){
    state.notes = { active: state.notes && (state.notes.active === "2" || state.notes.active === "3") ? state.notes.active : "1", slots: fresh.map(slot => {
      const found = old.find(item => item && item.id === slot.id);
      if (!found) return slot;
      return { id: slot.id, title: String(found.title || slot.title).slice(0, 40), body: String(found.body || "").slice(0, 8000), place: Math.max(0, Math.floor(Number(found.place) || 0)) };
    }) };
  }
  return state.notes;
}
function noteNow(){ const notes = book(); return notes.slots.find(slot => slot.id === notes.active) || notes.slots[0]; }
function scriptLines(body){ return String(body || "").split(/\n+|(?<=[.!?])\s+/).map(line => line.trim()).filter(Boolean).slice(0, 80); }
function speakChunk(text, onMark){
  return new Promise(async (resolve) => {
    const lang = state.settings.outputLang || "en";
    let spoken = text;
    if (lang !== "en") spoken = (await translateLine(text, lang)).text;
    if (!window.speechSynthesis) return resolve(false);
    speechSynthesis.cancel();
    const shaped = shape();
    const voice = pickLangVoice(lang);
    const utter = new SpeechSynthesisUtterance(spoken);
    utter.lang = BCP[lang] || "en-US";
    utter.rate = liveCall() ? Math.min(shaped.rate, 0.8) : shaped.rate;
    utter.pitch = shaped.pitch;
    utter.volume = 1;
    if (voice) utter.voice = voice;
    utter.onboundary = (event) => { if (onMark) onMark(event.charIndex || 0); };
    utter.onend = () => resolve(true);
    utter.onerror = () => resolve(false);
    setTimeout(() => { speechSynthesis.resume(); speechSynthesis.speak(utter); }, 40);
  });
}
function pauseNote(){ noteGen += 1; noteReading = false; if (window.speechSynthesis) speechSynthesis.cancel(); speaking = ""; }
async function readNote(from){
  const slot = noteNow();
  const lines = scriptLines(slot.body);
  if (!lines.length){ notice = "This note is empty."; render(); return; }
  const mine = ++noteGen;
  let index = from == null ? slot.place || 0 : from;
  if (index < 0 || index >= lines.length) index = 0;
  noteReading = true;
  applyRoute();
  for (let i = index; i < lines.length; i += 1){
    if (mine !== noteGen){ noteReading = false; return; }
    slot.place = i;
    noteMark = 0;
    save();
    const here = document.getElementById("note-here");
    if (here || document.getElementById("note-go")) paintNote();
    else render();
    const ok = await speakChunk(lines[i], (at) => {
      if (mine !== noteGen) return;
      noteMark = at;
      const live = document.getElementById("note-here");
      if (live) live.textContent = lines[i].slice(0, at) + " | " + lines[i].slice(at);
    });
    if (!ok || mine !== noteGen){ noteReading = false; if (mine === noteGen) speaking = ""; save(); if (document.getElementById("note-go")) paintNote(); return; }
  }
  slot.place = lines.length;
  noteReading = false;
  speaking = "";
  notice = "That note is finished.";
  save();
  render();
}
function paintNote(){
  const slot = noteNow();
  const lines = scriptLines(slot.body);
  const at = Math.min(slot.place || 0, lines.length);
  const button = document.getElementById("note-go");
  if (button) button.textContent = noteReading ? "Pause · line " + (at + 1) + " of " + lines.length : !lines.length ? "Nothing to say yet" : at >= lines.length ? "Speak from the start" : at === 0 ? "Speak this note" : "Continue · line " + (at + 1) + " of " + lines.length;
  const here = document.getElementById("note-here");
  const line = lines[at] || "";
  if (here) here.textContent = noteReading ? line.slice(0, noteMark) + " | " + line.slice(noteMark) : line;
  const box = document.getElementById("note-lines");
  if (box) box.innerHTML = lines.map((item, index) => `<button class="wide ${index === at && at < lines.length ? "ink" : "ghost"}" data-jump="${index}" type="button" style="margin-top:.35rem"><b>${index === at && at < lines.length ? "Here" : index + 1}</b> ${esc(item)}</button>`).join("");
}
function notepad(){
  const notes = book();
  const slot = noteNow();
  const lines = scriptLines(slot.body);
  const at = Math.min(slot.place || 0, lines.length);
  const label = noteReading ? "Pause · line " + (Math.min(at, lines.length - 1) + 1) + " of " + lines.length : !lines.length ? "Nothing to say yet" : at >= lines.length ? "Speak from the start" : at === 0 ? "Speak this note" : "Continue · line " + (at + 1) + " of " + lines.length;
  const picks = notes.slots.map(item => `<button class="${item.id === notes.active ? "ink" : "ghost"}" data-slot="${item.id}" type="button">${esc(item.title || "Slot")}</button>`).join("");
  const list = lines.map((item, index) => `<button class="wide ${index === at && at < lines.length ? "ink" : "ghost"}" data-jump="${index}" type="button" style="margin-top:.35rem"><b>${index === at && at < lines.length ? "Here" : index + 1}</b> ${esc(item)}</button>`).join("");
  return `<p class="muted">Write the conversation first. The phone says it one line at a time. Pause, use another button, then continue on the same line. All three slots stay on this phone.</p>
    <div class="grid" style="margin:.5rem 0;grid-template-columns:1fr 1fr 1fr">${picks}</div>
    <label for="note-title">Name</label>
    <input id="note-title" value="${esc(slot.title)}">
    <label for="note-body">The words</label>
    <textarea id="note-body" rows="8" placeholder="One sentence on each line works best." style="min-height:12rem">${esc(slot.body)}</textarea>
    <button class="wide teal" id="note-go" type="button">${label}</button>
    <p id="note-here" class="muted">${esc(lines[at] || "")}</p>
    ${at > 0 ? `<button class="wide ghost" id="note-restart" type="button">Start over</button>` : ""}
    <div id="note-lines">${list}</div>`;
}
function liveCall(){
  const output = state.settings.output || "auto";
  return output === "call" || (output === "auto" && detectedCall);
}
let screenLock = null;
async function applyRoute(){

let ringTimer = 0, ringCtx = null, rangToken = "", due = null;
function stopRing(){
  clearInterval(ringTimer);

  if (ringCtx){ try { ringCtx.close(); } catch (error) {} ringCtx = null; }
  if (navigator.vibrate) navigator.vibrate(0);
}
function startRing(vibrate){
  stopRing();

  if (!Ctx) return;
  const ctx = new Ctx();
  ringCtx = ctx;
  const beep = () => {
    if (ringCtx !== ctx) return;
    const tone = ctx.createOscillator();
    const gain = ctx.createGain();
    tone.type = "square";
    tone.frequency.value = 880;
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    tone.connect(gain);
    gain.connect(ctx.destination);
    tone.start();
    tone.stop(ctx.currentTime + 0.3);
  };
  beep();
  ringTimer = setInterval(beep, 900);
  if (vibrate !== false && navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 700]);
  setTimeout(() => { if (ringCtx === ctx) stopRing(); }, 45000);
}

  return `<button class="wide" data-go="notes" type="button" style="text-align:left;margin-bottom:.6rem"><b>Notepad</b><br><span class="muted">Write a long script. Pause it, then start again on the same line.</span></button>
    <label for="box">What should the phone say?</label>
    <div class="chips" style="flex-wrap:nowrap;overflow-x:auto">${LANGS.map(([id,label]) => `<button class="chip${(state.settings.outputLang||"en")===id?" on":""}" data-lang="${id}" type="button">${label}</button>`).join("")}</div>
    <p class="muted" id="gloss"></p>
    <div id="composer">
      ${phraseOn ? hintRow(pack.phrases, "phrase") : `<div id="phrase-line"></div>`}
      ${wordOn ? hintRow(pack.words, "word") : `<div id="word-line"></div>`}
      <div class="row" style="align-items:stretch">
        <textarea id="box" rows="2" style="min-height:4.2rem;margin:0;flex:1">${esc(draft)}</textarea>
        <button class="teal" id="do-say" type="button" style="width:6rem">Say it</button>
      </div>
    </div>
    <div class="row" style="align-items:center;gap:.4rem"><span class="muted">Soft</span><input id="mood" type="range" min="0" max="100" value="${moodSafe}" aria-label="Mood, from soft to harsh" style="flex:1;accent-color:#0e6b62"><span class="muted">Harsh</span></div>
    <p class="muted" id="mood-word">${word}</p>
    <div class="row" style="align-items:center;gap:.4rem"><span class="muted">Slow</span><input id="speed" type="range" min="70" max="135" value="${Math.round((Number(state.settings.speed)||1)*100)}" aria-label="Speed, from slow to fast" style="flex:1;accent-color:#0e6b62"><span class="muted">Fast</span></div>
    <div class="row" style="align-items:center;gap:.4rem"><span class="muted">Low</span><input id="pitch" type="range" min="55" max="155" value="${Math.round((Number(state.settings.pitch)||1)*100)}" aria-label="Pitch, from low to high" style="flex:1;accent-color:#0e6b62"><span class="muted">High</span></div>
    <button class="wide ghost" id="hear-voice" type="button">Hear this voice</button>
    <p style="margin:.4rem 0 .2rem;font-weight:600">Women</p>
    <div class="chips">${PRESETS.filter(p => p.kind==="woman").map(p => `<button class="chip${p.id===state.settings.presetId?" on":""}" data-preset="${p.id}" data-preview="1" type="button">${p.name}</button>`).join("")}</div>
    <p style="margin:.4rem 0 .2rem;font-weight:600">Men</p>
    <div class="chips">${PRESETS.filter(p => p.kind==="man").map(p => `<button class="chip${p.id===state.settings.presetId?" on":""}" data-preset="${p.id}" data-preview="1" type="button">${p.name}</button>`).join("")}</div>
    <p style="margin:.4rem 0 .2rem;font-weight:600">Play voices</p>
    <div class="chips">${chips}</div>
    ${options}`;
}
function call(){
  return `<div class="card"><h2 style="margin:.1rem 0 .4rem">So the other person can hear her</h2>
    <p>Tap Phone call at the top. On the call screen, tap Speaker, turn the volume up, and hold the phone a little away. She is heard through the microphone.</p></div>
    <button class="wide teal" data-speak="Can you hear me? I am using SteadyVoice because I cannot speak." type="button">Test: Can you hear me?</button>
    <div class="grid" style="margin-top:.7rem">${phrases().filter(p => p.id !== "emergency" && p.id !== "911").slice(0,8).map(p => `<button class="pad" data-speak="${esc(p.speak)}" type="button"><b>${esc(p.label)}</b></button>`).join("")}</div>
    ${fold("call", "Call options", `<button class="wide ghost" id="lead" type="button">${state.settings.leadIn ? "Starts with Please listen" : "Phrase only"}</button><div class="voices" style="margin-top:.5rem">${PRESETS.map(p => `<button class="voice${p.id===state.settings.presetId?" on":""}" data-preset="${p.id}" type="button"><b>${p.name}</b></button>`).join("")}</div>`)}`;
}
let openTalk = "";
function more(){
  const women = voices();
  ensureTalks();
  if (openTalk){
    const talk = state.talks.find(item => item.id === openTalk);
    if (talk) return `<button class="wide ghost" id="close-talk" type="button">Back</button>
      <h2 style="margin:.6rem 0 .3rem">${esc(talk.title)}</h2>
      <button class="wide teal" id="replay-open" type="button">Say this talk again</button>
      ${talk.lines.map(line => `<button class="wide ghost" data-speak="${esc(line)}" type="button" style="margin-top:.4rem">${esc(line)}</button>`).join("")}
      <button class="wide" id="delete-talk" type="button" style="margin-top:.7rem">Delete this talk</button>`;
    openTalk = "";
  }
  const current = state.talks.find(item => item.id === state.currentId) || {title:"", lines:[]};
  const earlier = state.talks.filter(item => item.id !== state.currentId && item.lines && item.lines.length);
  const recent = current.lines.slice(-4).map(line => `<p class="muted">${esc(line)}</p>`).join("") || `<p class="muted">Nothing yet. Tap a button and it will show up here.</p>`;
  const old = earlier.map(item => `<button class="wide ghost" data-open-talk="${esc(item.id)}" type="button" style="margin-top:.4rem"><b>${esc(item.title)}</b><br><span class="muted">${item.lines.length} lines · ${esc(item.lines[0])}</span></button>`).join("");
  return `<div class="card"><b>Conversations</b><p>What she says is kept on this phone, in order. Save a talk to start a fresh one and still say the old one later.</p>
    <p><b>This talk</b> · ${esc(current.title || "")}</p>
    ${recent}
    <button class="wide teal" id="replay-current" type="button" ${current.lines.length ? "" : "disabled"}>Say this talk again</button>
    <button class="wide ink" id="save-talk" type="button" style="margin-top:.4rem" ${current.lines.length ? "" : "disabled"}>Save and start a new talk</button>
    ${current.lines.length ? `<button class="wide ghost" data-open-talk="${esc(state.currentId)}" type="button" style="margin-top:.4rem">See every line</button>` : ""}
    ${old ? `<p class="kicker" style="margin-top:.8rem">Earlier</p>${old}` : ""}
  </div>
    <div class="card"><b>Voices</b><p>Clara, Helen, June, Mae, and Nora are women. Owen, Caleb, Miles, and Arthur are men. Speed and pitch are on Type a sentence. They use a free voice already on this phone. ${women.length ? "Found: " + esc(women.map(v=>v.name).slice(0,4).join(", ")) : "No named voice yet."} The best free packs come from the phone itself. On Android, search Settings for Text-to-speech, open Google Text-to-speech, and install voice data for her language, male and female if both are listed. On iPhone: Settings, Accessibility, Spoken Content, Voices.</p>
    <div class="voices">${PRESETS.map(p => `<button class="voice${p.id===state.settings.presetId?" on":""}" data-preset="${p.id}" data-preview="1" type="button">${p.name}</button>`).join("")}</div></div>
    <div class="card"><b>Text a phrase</b><p>Text opens the phone's own Messages app with the words filled in. She taps Send. WhatsApp does the same if it is installed. A new messaging app is not required.</p>
    <button class="wide ink" data-speak="" data-text="I had a stroke. I can hear you. I cannot speak. Please read this text." type="button">Text: I cannot speak</button></div>
    <div class="card"><b>Put it on the phone</b><p>An iPhone cannot install a random downloaded app. The simple way is Add to Home Screen from Chrome or Safari. Or send this one file, save it in Downloads, and open it with Chrome. Do not open it from inside a zip.</p></div>
    <button class="wide ink" id="unlock" type="button">Arrange the board</button>
    <p class="muted">Arrange is locked until you tap that. Done locks it again. Nothing is uploaded.</p>
    ${fold("more", "More options", `<label>Her name<input id="name" value="${esc(state.settings.name||"")}" placeholder="First name"></label>`)}`;
}
view.addEventListener("pointerdown", (event) => {
  const hint = event.target.closest("[data-suggest], #do-say");
  if (hint && document.activeElement && document.activeElement.id === "box") event.preventDefault();
});
view.addEventListener("click", (event) => {
  const t = event.target.closest("button");
  if (!t) return;
  if (t.dataset.go){
    if (t.dataset.go === "guide"){ guideOn = true; guideStep = 0; render(); return; }
    if (t.dataset.go === "talks"){ tab = "more"; openTalk = ""; render(); return; }
    if (t.dataset.go === "emergency"){ tab = "board"; folds.emergency = true; render(); return; }
    tab = t.dataset.go;
    render();
    return;
  }
  if (t.id === "note-go" || t.id === "note-bar"){
    if (noteReading){ pauseNote(); render(); }
    else readNote();
    return;
  }
  if (t.id === "note-restart"){ pauseNote(); noteNow().place = 0; save(); readNote(0); return; }
  if (t.dataset.slot){ pauseNote(); book().active = t.dataset.slot; save(); render(); return; }
  if (t.dataset.jump){ readNote(Number(t.dataset.jump)); return; }
  if (t.dataset.fact){ const fact = profileFacts()[Number(t.dataset.fact)]; if (fact) say(fact.say); return; }
  if (t.id === "add-person"){
    const profile = mine();
    if (profile.people.length >= 8) return;
    profile.people.push({id:"person-"+Date.now(), name:"", relation:"", note:""});
    save(); render(); return;
  }
  if (t.dataset.dropPerson){ const profile = mine(); profile.people = profile.people.filter(person => person.id !== t.dataset.dropPerson); save(); render(); return; }
  if (t.id === "add-memory"){
    const box = document.getElementById("memory");
    const text = box ? box.value.trim() : "";
    if (!text) return;
    const profile = mine();
    profile.reminders.unshift({id:"memory-"+Date.now(), text:text.slice(0, 240), at:Date.now()});
    profile.reminders = profile.reminders.slice(0, 30);
    save(); render(); return;
  }
  if (t.dataset.memory){ const item = mine().reminders.find(row => row.id === t.dataset.memory); if (item) say(item.text); return; }
  if (t.dataset.dropMemory){ const profile = mine(); profile.reminders = profile.reminders.filter(row => row.id !== t.dataset.dropMemory); save(); render(); return; }
  if (t.id === "took-dose" || t.id === "stop-dose"){ if (due) markDose(due.dose.id, due.time); due = null; rangToken = ""; stopRing(); render(); return; }
  if (t.dataset.diabetic){ const profile = mine(); profile.diabetic = profile.diabetic === t.dataset.diabetic ? "" : t.dataset.diabetic; save(); render(); return; }
  if (t.id === "add-dose"){
    const name = (document.getElementById("med-name") || {}).value || "";
    const amount = (document.getElementById("med-amount") || {}).value || "";
    const time = (document.getElementById("med-time") || {}).value || "";
    if (!name.trim() || !time) return;
    const profile = mine();
    profile.doses.push({id:"dose-" + Date.now(), name:name.trim().slice(0, 60), amount:amount.trim().slice(0, 40), times:[time], sound:true, vibrate:true});
    profile.doses = profile.doses.slice(0, 12);
    save(); render(); return;
  }
  if (t.id === "allow-alerts" && window.Notification){ Notification.requestPermission(); return; }
  if (t.dataset.doseSound){ const dose = mine().doses.find(item => item.id === t.dataset.doseSound); if (dose){ dose.sound = dose.sound === false; save(); render(); } return; }
  if (t.dataset.doseVibrate){ const dose = mine().doses.find(item => item.id === t.dataset.doseVibrate); if (dose){ dose.vibrate = dose.vibrate === false; save(); render(); } return; }
  if (t.dataset.testDose){ startRing(true); setTimeout(stopRing, 3500); return; }
  if (t.dataset.dropDose){ const profile = mine(); profile.doses = profile.doses.filter(item => item.id !== t.dataset.dropDose); save(); render(); return; }
  if (t.id === "save-profile"){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "steadyvoice-backup.json";
    link.click();
    notice = "Saved. Keep that file. It puts her information back after a reinstall.";
    render();
    return;
  }
  if (t.dataset.suggest){
    const suggestion = t.dataset.suggest;
    const kind = t.dataset.kind || "word";
    if (kind === "phrase") draft = suggestion;
    else {
      const current = draft.trim();
      if (!current || suggestion.toLowerCase().startsWith(current.toLowerCase())) draft = suggestion + " ";
      else {
        const parts = current.split(/\s+/);
        parts[parts.length - 1] = suggestion;
        draft = parts.join(" ") + " ";
      }
    }
    render();
    const box = $("#box");
    if (box){ box.focus(); box.scrollTop = box.scrollHeight; }
    return;
  }
  if (t.id === "guide-next"){
    if (guideStep >= 3){ guideOn = false; state.settings.seenTutorial = true; save(); }
    else guideStep += 1;
    render();
    return;
  }
  if (t.id === "guide-skip"){ guideOn = false; state.settings.seenTutorial = true; save(); render(); return; }
  if (t.dataset.fold){ folds[t.dataset.fold] = !folds[t.dataset.fold]; render(); return; }
  if (t.id === "replay-current"){ replayTalk(state.currentId); return; }
  if (t.id === "replay-open"){ replayTalk(openTalk); return; }
  if (t.id === "save-talk"){ saveTalk(); return; }
  if (t.id === "close-talk"){ openTalk = ""; render(); return; }
  if (t.id === "delete-talk"){
    state.talks = (state.talks || []).filter(item => item.id !== openTalk);
    if (openTalk === state.currentId) state.currentId = "";
    openTalk = "";
    ensureTalks();
    save();
    render();
    return;
  }
  if (t.dataset.openTalk){ openTalk = t.dataset.openTalk; render(); return; }
  if (t.dataset.comedy !== undefined){
    state.settings.comedyId = t.dataset.comedy;
    save();
    if (t.dataset.comedy && !liveCall()){
      const picked = COMEDY.find(item => item.id === t.dataset.comedy);
      say("Hello. This is the " + (picked ? picked.name : "play") + " voice.");
    } else render();
    return;
  }
  if (t.id === "reset-voice"){ state.settings.comedyId = ""; state.settings.mood = 50; save(); render(); return; }
  if (t.id === "unlock"){ arranging = true; tab = "board"; render(); return; }
  if (t.id === "done"){ arranging = false; render(); return; }
  if (t.id === "theme"){ state.settings.theme = state.settings.theme === "night" ? "paper" : "night"; save(); render(); return; }
  if (t.id === "cols"){ state.settings.columns = state.settings.columns === 1 ? 2 : state.settings.columns === 2 ? 3 : 1; save(); render(); return; }
  if (t.id === "chips"){ state.settings.showChips = state.settings.showChips === false; save(); render(); return; }
  if (t.id === "dock"){ state.settings.showDock = state.settings.showDock === false; save(); render(); return; }
  if (t.dataset.sort){ state.settings.sort = t.dataset.sort; save(); render(); return; }
  if (t.dataset.move){ move(t.dataset.move, Number(t.dataset.dir)); return; }
  if (t.dataset.hide){ state.hidden = (state.hidden||[]).concat(t.dataset.hide); save(); render(); return; }
  if (t.dataset.show){ state.hidden = (state.hidden||[]).filter(id => id !== t.dataset.show); save(); render(); return; }
  if (t.dataset.group){ group = t.dataset.group; render(); return; }
  if (t.dataset.speak !== undefined && t.dataset.speak){ say(t.dataset.speak); return; }
  if (t.dataset.text){ textIt(t.dataset.text); return; }
  if (t.dataset.preset){
    state.settings.presetId = t.dataset.preset;
    state.settings.voiceURI = "";
    save();
    if (t.dataset.preview) say("Hello. This is " + preset().name + ". I am here with you.");
    else render();
    return;
  }
  if (t.dataset.word){ draft = (draft ? draft.trim() + " " : "") + t.dataset.word; render(); const box = $("#box"); if (box) box.focus(); return; }
  if (t.id === "word-line"){ state.settings.wordLine = state.settings.wordLine === false; save(); render(); return; }
  if (t.id === "phrase-toggle"){ state.settings.phraseLine = state.settings.phraseLine === false; save(); render(); return; }
  if (t.id === "pin-box"){ state.settings.pinBox = state.settings.pinBox === false; save(); render(); return; }
  if (t.dataset.from){ state.settings.hintFrom = t.dataset.from; save(); render(); return; }
  if (t.id === "hear-voice"){ say("Hello. This is how I sound. You can make me lower, higher, slower, or faster."); return; }
  if (t.id === "do-say") say(draft);
  if (t.dataset.lang){ state.settings.outputLang = t.dataset.lang; save(); render(); queueGloss(); return; }
  if (t.id === "do-text" && draft.trim()){ translateLine(draft.trim(), state.settings.outputLang || "en").then(result => textIt(result.text)); return; }
  if (t.id === "do-wa" && draft.trim()){ translateLine(draft.trim(), state.settings.outputLang || "en").then(result => wa(result.text)); return; }
  if (t.id === "lead"){ state.settings.leadIn = !state.settings.leadIn; save(); render(); }
});
view.addEventListener("input", (event) => {
  if (event.target.id === "q"){ query = event.target.value; const pos = event.target.selectionStart; render(); const q = $("#q"); if (q){ q.focus(); q.selectionStart = q.selectionEnd = pos; } }
  if (event.target.id === "box"){
    draft = event.target.value;
    event.target.scrollTop = event.target.scrollHeight;
    paintHints();
    queueGloss();
  }
  if (event.target.id === "mood"){
    state.settings.mood = Number(event.target.value);
    const word = state.settings.mood < 35 ? "Soft" : state.settings.mood > 65 ? "Harsh" : "Natural";
    const label = $("#mood-word");
    if (label) label.textContent = word;
    save();
  }
  if (event.target.id === "speed"){ state.settings.speed = Number(event.target.value) / 100; save(); }
  if (event.target.id === "pitch"){ state.settings.pitch = Number(event.target.value) / 100; save(); }
  if (event.target.id === "note-title"){ noteNow().title = event.target.value.slice(0, 40); save(); }
  if (event.target.id === "note-body"){
    if (noteReading) pauseNote();
    const slot = noteNow();
    slot.body = event.target.value;
    const count = scriptLines(slot.body).length;
    if ((slot.place || 0) > count) slot.place = count;
    save();
    paintNote();
  }
  if (event.target.dataset.field){
    mine()[event.target.dataset.field] = event.target.value.slice(0, 240);
    if (event.target.dataset.field === "preferred" || event.target.dataset.field === "fullName"){
      const profile = mine();
      state.settings.name = (profile.preferred || profile.fullName || "").trim();
    }
    save();
  }
  if (event.target.dataset.person){
    const person = mine().people.find(item => item.id === event.target.dataset.person);
    if (person) person[event.target.dataset.part] = event.target.value.slice(0, 160);
    save();
  }
  if (event.target.id === "name"){ state.settings.name = event.target.value; save(); }
});
view.addEventListener("change", (event) => {
  if (event.target.id !== "restore-profile" || !event.target.files || !event.target.files[0]) return;
  event.target.files[0].text().then(text => {
    try {
      const next = JSON.parse(text);
      if (!next || typeof next !== "object") throw new Error("bad");
      if (next.profile && !next.settings){ state.profile = next.profile; mine(); }
      else if (next.settings){ Object.assign(state, next); state.settings = Object.assign({presetId:"nora"}, next.settings); mine(); book(); }
      else throw new Error("bad");
      save();
      notice = "Her information is back on this phone.";
    } catch {
      notice = "That file is not a SteadyVoice backup.";
    }
    render();
  });
});
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; notice = ""; render(); });
$("#sound").addEventListener("click", (event) => {
  const t = event.target.closest("button");
  if (!t) return;
  if (t.id === "sound-more"){ soundOpen = !soundOpen; renderSound(); return; }
  if (t.id === "sound-lead"){ state.settings.leadIn = !state.settings.leadIn; save(); renderSound(); return; }
  if (t.id === "sound-test"){ say("This is SteadyVoice. Can you hear me?"); return; }
  if (t.dataset.out){
    state.settings.output = t.dataset.out;
    if (t.dataset.out !== "auto") soundOpen = false;
    save();
    applyRoute();
    render();
  }
});
$("#stop").onclick = () => { pauseNote(); speaking = ""; render(); };
$("#home").onclick = () => { tab = "menu"; arranging = false; openTalk = ""; notice = ""; render(); };
$("#again").onclick = () => { if (state.history[0]) say(state.history[0]); };
document.body.addEventListener("click", (event) => {
  const t = event.target.closest("[data-say]");
  if (t && t.closest("footer")) say(t.dataset.say);
});
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (tab === "more" || tab === "call") render(); };
setInterval(checkDose, 15000);
if (navigator.audioSession && navigator.audioSession.addEventListener) {
  navigator.audioSession.addEventListener("statechange", () => {
    const next = navigator.audioSession.state === "interrupted";
    if (next === detectedCall) return;
    detectedCall = next;
    if ((state.settings.output || "auto") === "auto") notice = next ? "A call took over the sound. Phone call is on." : "Sound is back on the speaker.";
    applyRoute();
    render();
  });
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  resumeVoice();
  applyRoute();
});
window.addEventListener("pageshow", () => { resumeVoice(); applyRoute(); });
applyRoute();
render();
